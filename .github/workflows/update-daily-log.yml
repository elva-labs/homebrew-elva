name: Update daily-log cask

# Pull model: this repo checks daily_log's latest release and updates its own
# cask, so no cross-repo token is needed — GITHUB_TOKEN can write here because
# "here" is the repository the workflow runs in.

on:
  schedule:
    - cron: "23 * * * *"   # hourly; a release shows up within the hour
  workflow_dispatch:       # or immediately, by hand

permissions:
  contents: write

concurrency: update-daily-log

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository == 'elva-labs/homebrew-elva'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare latest release with the cask
        id: check
        run: |
          LATEST="$(gh release view --repo elva-labs/daily_log --json tagName --jq '.tagName' | sed 's/^v//')"
          CURRENT="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/daily-log.rb)"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "cask: $CURRENT, release: $LATEST"

      - name: Rewrite the cask
        if: steps.check.outputs.latest != steps.check.outputs.current
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          gh release download "v${VERSION}" --repo elva-labs/daily_log --pattern "daily_log-${VERSION}.zip" -D /tmp
          SHA="$(sha256sum "/tmp/daily_log-${VERSION}.zip" | cut -d' ' -f1)"
          cat > Casks/daily-log.rb <<CASK
          cask "daily-log" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/elva-labs/daily_log/releases/download/v#{version}/daily_log-#{version}.zip"
            name "daily_log"
            desc "Menu-bar agent that nudges you to log what you are doing"
            homepage "https://github.com/elva-labs/daily_log"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: :tahoe

            app "daily_log.app"

            uninstall launchctl: "se.axtelius.daily-log",
                      quit:      "se.axtelius.daily-log"

            zap trash: [
              "~/Library/Application Support/daily",
              "~/Library/Preferences/se.axtelius.daily-log.plist",
            ]
          end
          CASK
          git config user.name "elva-bot"
          git config user.email "gh-bot@elva-group.com"
          git add Casks/daily-log.rb
          git commit -m "Update daily-log to v${VERSION}"
          git push
